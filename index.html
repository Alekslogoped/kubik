<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя одевалка</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f3ff;
  color: #47375d;
}
button { font: inherit; cursor: pointer; }
.header { text-align: center; padding: 18px 12px 8px; }
.header h1 { margin: 0 0 8px; font-size: 28px; }
.header p { margin: 0; }
.game {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) minmax(300px, 1fr);
  gap: 20px;
}
.stage, .wardrobe {
  background: white;
  border-radius: 24px;
  padding: 16px;
  box-shadow: 0 8px 28px #65458112;
}
#scene {
  display: block;
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 18px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 14px;
}
.action {
  border: 0;
  border-radius: 14px;
  padding: 13px 18px;
  background: #efe8fa;
  color: #47375d;
  font-weight: bold;
}
.primary { background: #9260d5; color: white; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  border: 0;
  background: #f3edf9;
  color: #47375d;
  border-radius: 12px;
  padding: 11px 13px;
}
.tab.active { background: #9260d5; color: white; }
#categoryTitle { font-size: 21px; margin: 24px 0 14px; }
.items {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.item {
  min-height: 110px;
  border: 3px solid transparent;
  background: #f8f5fc;
  border-radius: 18px;
  padding: 12px 5px;
  color: #47375d;
}
.item.selected { border-color: #9260d5; background: #f0e6ff; }
.item .icon { display: block; font-size: 36px; margin-bottom: 8px; }
.note { font-size: 14px; line-height: 1.5; color: #84758f; }
dialog {
  border: 0;
  border-radius: 24px;
  padding: 20px;
  width: min(440px, 94vw);
  max-height: 94vh;
  overflow: auto;
  text-align: center;
}
dialog::backdrop { background: #28193899; }
dialog h2 { margin: 0 0 12px; }
#photo { display: block; width: 100%; max-height: 62vh; object-fit: contain; }
#status { text-align: center; min-height: 22px; }
button:focus-visible, a:focus-visible {
  outline: 3px solid #f7a531;
  outline-offset: 3px;
}
@media (max-width: 700px) {
  .game { grid-template-columns: 1fr; gap: 12px; }
  #scene { max-height: 49vh; }
  .header h1 { font-size: 24px; }
}
</style>
</head>
<body>
<header class="header">
  <h1>✨ Моя одевалка</h1>
  <p>Выбери образ и сделай фото!</p>
</header>

<main class="game">
  <section class="stage" aria-label="Герой">
    <canvas id="scene" width="600" height="800"
      aria-label="Герой в выбранной одежде"></canvas>
    <div class="actions">
      <button class="action" id="reset">↩ Сначала</button>
      <button class="action primary" id="shoot">📸 Сделать фото</button>
    </div>
  </section>

  <section class="wardrobe">
    <nav class="tabs" id="tabs" aria-label="Разделы гардероба"></nav>
    <h2 id="categoryTitle"></h2>
    <div class="items" id="items"></div>
    <p class="note">Нажми на вещь, чтобы примерить её.</p>
  </section>
</main>

<p id="status" role="status"></p>

<dialog id="photoDialog">
  <h2>📸 Твой образ готов!</h2>
  <img id="photo" alt="Фото героя в выбранном образе">
  <div class="actions">
    <button class="action primary" id="download">⬇ Скачать фото</button>
    <button class="action" id="closePhoto">Переодеть</button>
  </div>
</dialog>

<script>
/*
  НАШИ КАРТИНКИ

  Сейчас src пустые — рисуются демонстрационные варианты.
  Позже укажем пути, например:
  heroSrc = "images/hero.png";
  src: "images/top-pink.png"

  Герой и все вещи: прозрачные PNG размером 600 × 800.
  Вещь должна находиться на нужном месте относительно героя.
  Фоны: 600 × 800, без прозрачности.
*/
const heroSrc = "";

const catalog = {
  tops: {
    title: "Выбери верх", label: "👕 Верх",
    items: [
      { id: "pink", name: "Розовый", icon: "👚", color: "#f293bc", src: "" },
      { id: "blue", name: "Голубой", icon: "👕", color: "#89c9ed", src: "" },
      { id: "yellow", name: "Жёлтый", icon: "👕", color: "#f6d879", src: "" }
    ]
  },
  bottoms: {
    title: "Выбери низ", label: "👖 Низ",
    items: [
      { id: "skirt", name: "Юбка", icon: "👗", color: "#ba9ae5", src: "" },
      { id: "jeans", name: "Джинсы", icon: "👖", color: "#729cd7", src: "" },
      { id: "shorts", name: "Шорты", icon: "🩳", color: "#91cfbb", src: "" }
    ]
  },
  shoes: {
    title: "Выбери обувь", label: "👟 Обувь",
    items: [
      { id: "purple", name: "Сиреневая", icon: "🥿", color: "#9470cb", src: "" },
      { id: "pink", name: "Розовая", icon: "👟", color: "#e68caf", src: "" },
      { id: "mint", name: "Мятная", icon: "👟", color: "#75bbaa", src: "" }
    ]
  },
  hair: {
    title: "Выбери причёску", label: "💇 Волосы",
    items: [
      { id: "brown", name: "Каштановые", icon: "👩", color: "#80543d", src: "" },
      { id: "blonde", name: "Светлые", icon: "👱‍♀️", color: "#e3bd68", src: "" },
      { id: "red", name: "Рыжие", icon: "👩‍🦰", color: "#bc7044", src: "" }
    ]
  },
  accessories: {
    title: "Выбери аксессуар", label: "🎀 Аксессуары",
    items: [
      { id: "none", name: "Без украшения", icon: "✖", src: "" },
      { id: "bow", name: "Бант", icon: "🎀", color: "#e76a9b", src: "" },
      { id: "crown", name: "Корона", icon: "👑", color: "#efc752", src: "" }
    ]
  },
  backgrounds: {
    title: "Выбери фон", label: "🌈 Фон",
    items: [
      { id: "studio", name: "Студия", icon: "💜", color: "#eee3fa", src: "" },
      { id: "garden", name: "Полянка", icon: "🌳", color: "#dff2e7", src: "" },
      { id: "sunny", name: "Солнечный", icon: "☀️", color: "#fff0ce", src: "" }
    ]
  }
};

const initial = {
  tops: "pink", bottoms: "skirt", shoes: "purple",
  hair: "brown", accessories: "none", backgrounds: "studio"
};

let selected = { ...initial };
let activeCategory = "tops";
let photoUrl = "";

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const dialog = document.getElementById("photoDialog");
const status = document.getElementById("status");
const images = new Map();

function getItem(category) {
  return catalog[category].items.find(item => item.id === selected[category]);
}

function ellipse(x, y, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function polygon(points, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.fill();
}

function rectangle(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawImage(src) {
  const img = images.get(src);
  if (!img) return false;
  ctx.drawImage(img, 0, 0, 600, 800);
  return true;
}

function drawHero() {
  if (heroSrc && drawImage(heroSrc)) return;

  const skin = "#f6ceb3";
  ellipse(300, 702, 110, 18, "#00000012");

  // Ноги, руки, шея и тело.
  rectangle(253, 480, 38, 192, skin);
  rectangle(309, 480, 38, 192, skin);
  ellipse(232, 396, 22, 100, skin);
  ellipse(368, 396, 22, 100, skin);
  rectangle(282, 260, 36, 48, skin);
  ellipse(300, 390, 65, 110, skin);

  // Базовая одежда.
  rectangle(244, 320, 112, 145, "#ffffff");
  rectangle(250, 460, 100, 50, "#ffffff");

  // Голова, уши и лицо.
  ellipse(236, 205, 13, 22, skin);
  ellipse(364, 205, 13, 22, skin);
  ellipse(300, 205, 66, 80, skin);
  ellipse(277, 207, 6, 9, "#493e43");
  ellipse(323, 207, 6, 9, "#493e43");
  ellipse(263, 234, 12, 7, "#efacaa");
  ellipse(337, 234, 12, 7, "#efacaa");

  ctx.strokeStyle = "#bd786e";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(300, 234, 15, 0.15, Math.PI - 0.15);
  ctx.stroke();
}

function drawLayer(category) {
  const item = getItem(category);
  if (item.src && drawImage(item.src)) return;

  const color = item.color;
  if (category === "bottoms") {
    if (item.id === "skirt") {
      polygon([[245,430],[355,430],[384,554],[216,554]], color);
    } else {
      const height = item.id === "jeans" ? 195 : 82;
      rectangle(245, 438, 110, 42, color);
      rectangle(245, 470, 47, height, color);
      rectangle(308, 470, 47, height, color);
    }
  }

  if (category === "tops") {
    polygon([
      [265,300],[282,291],[300,311],[318,291],[335,300],
      [387,343],[364,377],[351,351],[355,452],
      [245,452],[249,351],[236,377],[213,343]
    ], color);
    ellipse(300, 350, 13, 13, "#ffffff88");
  }

  if (category === "shoes") {
    ellipse(267, 678, 35, 17, color);
    ellipse(333, 678, 35, 17, color);
  }

  if (category === "hair") {
    ellipse(300, 142, 70, 39, color);
    ellipse(240, 190, 17, 59, color);
    ellipse(360, 190, 17, 59, color);
    polygon([[242,148],[351,146],[335,184],[294,159],[257,190]], color);
  }

  if (category === "accessories") {
    if (item.id === "bow") {
      polygon([[324,133],[351,115],[351,151]], color);
      polygon([[378,133],[351,115],[351,151]], color);
      ellipse(351,133,8,10,"#bd477c");
    }
    if (item.id === "crown") {
      polygon([
        [263,129],[255,91],[280,108],[300,77],
        [320,108],[345,91],[337,129]
      ], color);
    }
  }
}

function render() {
  ctx.clearRect(0, 0, 600, 800);
  const background = getItem("backgrounds");

  if (!background.src || !drawImage(background.src)) {
    rectangle(0, 0, 600, 800, background.color);
    ellipse(300, 385, 232, 325, "#ffffff66");
    rectangle(0, 710, 600, 90, "#ffffff44");
  }

  drawHero();
  ["bottoms", "tops", "shoes", "hair", "accessories"].forEach(drawLayer);
}

function showWardrobe() {
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren();

  Object.entries(catalog).forEach(([key, category]) => {
    const button = document.createElement("button");
    button.className = "tab" + (key === activeCategory ? " active" : "");
    button.textContent = category.label;
    button.setAttribute("aria-pressed", key === activeCategory);
    button.onclick = () => {
      activeCategory = key;
      showWardrobe();
    };
    tabs.append(button);
  });

  document.getElementById("categoryTitle").textContent =
    catalog[activeCategory].title;

  const container = document.getElementById("items");
  container.replaceChildren();

  catalog[activeCategory].items.forEach(item => {
    const button = document.createElement("button");
    const isSelected = selected[activeCategory] === item.id;
    button.className = "item" + (isSelected ? " selected" : "");
    button.setAttribute("aria-pressed", isSelected);

    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = item.icon;

    const label = document.createElement("span");
    label.textContent = item.name;

    button.append(icon, label);
    button.onclick = () => {
      selected[activeCategory] = item.id;
      render();
      showWardrobe();
    };
    container.append(button);
  });
}

document.getElementById("reset").onclick = () => {
  selected = { ...initial };
  render();
  showWardrobe();
  status.textContent = "";
};

document.getElementById("shoot").onclick = () => {
  try {
    render();
    photoUrl = canvas.toDataURL("image/png");
    document.getElementById("photo").src = photoUrl;
    dialog.showModal();
    status.textContent = "";
  } catch (error) {
    status.textContent = "Не удалось сделать фото. Проверь файлы картинок.";
  }
};

document.getElementById("download").onclick = () => {
  if (!photoUrl) return;
  const link = document.createElement("a");
  link.href = photoUrl;
  link.download = "my-look.png";
  document.body.append(link);
  link.click();
  link.remove();
};

document.getElementById("closePhoto").onclick = () => dialog.close();

async function loadImages() {
  const sources = [
    heroSrc,
    ...Object.values(catalog).flatMap(category =>
      category.items.map(item => item.src)
    )
  ].filter(Boolean);

  const failed = [];
  await Promise.all([...new Set(sources)].map(src =>
    new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        images.set(src, img);
        resolve();
      };
      img.onerror = () => {
        failed.push(src);
        resolve();
      };
      img.src = src;
    })
  ));

  render();
  if (failed.length) {
    status.textContent = "Часть картинок не загрузилась. Проверь пути в коде.";
  }
}

showWardrobe();
render();
loadImages();
</script>
</body>
</html>
